name: Build Android APK

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager --install "platforms;android-37" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        shell: bash
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_PATH" || ! -d "$SDK_PATH" ]]; then
            echo "Android SDK directory was not found." >&2
            exit 1
          fi
          cat > local.properties <<EOF
          sdk.dir=$SDK_PATH
          LASTFM_API_KEY=$LASTFM_API_KEY
          LASTFM_SECRET=$LASTFM_SECRET
          LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER
          EOF

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Dev Debug APKs
        run: ./gradlew --no-daemon :app:assembleDevDebug

      - name: Verify APK outputs
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*.apk' | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No APKs were produced." >&2
            exit 1
          fi
          printf '%s\n' "${apks[@]}"
          sha256sum "${apks[@]}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug-${{ github.run_number }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14
