name: Build Android APK

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            printf 'sdk.dir=%s\\n' "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            printf 'LASTFM_API_KEY=%s\\n' "$LASTFM_API_KEY"
            printf 'LASTFM_SECRET=%s\\n' "$LASTFM_SECRET"
            printf 'LISTEN_TOGETHER_SERVER=%s\\n' "$LISTEN_TOGETHER_SERVER"
          } > local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Dev Debug APKs
        run: ./gradlew --no-daemon :app:assembleDevDebug

      - name: Verify APK outputs
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/dev/debug/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No APKs were produced." >&2
            exit 1
          fi
          printf '%s\\n' "${apks[@]}"
          sha256sum "${apks[@]}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug-${{ github.run_number }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14
